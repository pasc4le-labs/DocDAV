<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Scorekeeper cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="0.55" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="860" y="60" width="14" height="180" rx="7" fill="url(#bar)"/>
  <rect x="930" y="110" width="14" height="130" rx="7" fill="#fcd34d" opacity="0.8"/>
  <rect x="1000" y="150" width="14" height="90" rx="7" fill="#fdba74" opacity="0.6"/>
  <text x="70" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Scorekeeper</text>
  <text x="72" y="218" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#fde68a">Keep score, stay in sync</text>
</svg>
