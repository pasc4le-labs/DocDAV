name: publish-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/pasc4le-labs/docdav
  PORT: 4323
  WEBDAV_PORT: 8090

jobs:
  build-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=DocDAV

      - name: Start local WebDAV (sample content)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone >/dev/null 2>&1
          rclone serve webdav ./sample --addr :${{ env.WEBDAV_PORT }} \
            --user demo --pass secret --dir-cache-time 2s &
          for i in $(seq 1 15); do
            curl -sf -u demo:secret -o /dev/null \
              http://127.0.0.1:${{ env.WEBDAV_PORT }}/ && break
            sleep 1
          done

      - name: Smoke test pushed image
        run: |
          set -euo pipefail
          IMG=${{ env.IMAGE }}:${{ github.ref_name }}
          CID=$(docker run -d \
            --network host \
            -e WEBDAV_URL=http://127.0.0.1:${{ env.WEBDAV_PORT }}/ \
            -e WEBDAV_USER=demo \
            -e WEBDAV_PASS=secret \
            -e PORT=${{ env.PORT }} \
            "$IMG")
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          ok=""
          for i in $(seq 1 30); do
            # scorekeeper is a public product (no password) → good readiness probe.
            if curl -sf -o /dev/null http://localhost:${{ env.PORT }}/scorekeeper; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "service did not come up"; exit 1; }
          # Homepage is gated by the site password (sample/site.yaml: site-secret).
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:${{ env.PORT }}/)" = "401" ]
          curl -sf "http://localhost:${{ env.PORT }}/?key=site-secret" | grep -qi "Documentation"
          curl -sf -o /dev/null -w "landing: %{http_code}\n" "http://localhost:${{ env.PORT }}/?key=site-secret"
          curl -sf -o /dev/null -w "product: %{http_code}\n" \
            "http://localhost:${{ env.PORT }}/atlas?key=atlaspass"
